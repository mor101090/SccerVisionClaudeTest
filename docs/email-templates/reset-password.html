<!--
  Supabase → Authentication → Emails → Templates → "Reset password"
  Subject: Reset your Soccer Vision password
  The link must be {{ .RedirectTo }}?token={{ .TokenHash }}: the site redeems the token only when the new
  password is submitted (/auth/reset-password), so mail scanners that open links can't use it up.
  {{ .RedirectTo }} is https://soccer.dev-spirit.com/auth/reset-password once that URL is on the Redirect URLs list.

  Colors: email clients ignore stylesheets and CSS variables, so every color is written as the hex VALUE of a token in
  app/src/app/globals.css, by the roles of the Login reference screen. email-templates.test.ts fails on any other hex.
    #17062e  color/bg          (--mor-dark-purple)   page background
    #252735  color/panel-2     (--mor-search-bar)    card
    #2a3142  color/panel       (--mor-dark-blue)     header bar; also color/button, color/divider
    #dde9ff  color/text        (--mor-button-text)   headings; button label (color/button-text); header divider
    #798ba9  color/muted       (--mor-line)          body and footer text
    #39445b  color/border      (--mor-pressed-button) card and button stroke
    #626ed4  color/link        (--mor-bright-purple) links
-->
<!doctype html>
<html lang="en">
  <head>
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
  </head>
  <body style="margin:0;padding:0;background:#17062e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#17062e;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#252735;border:1px solid #39445b;border-radius:14px;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <tr>
              <td style="background:#2a3142;padding:18px 28px;border-bottom:1px solid #dde9ff;">
                <img src="https://soccer.dev-spirit.com/brand/logo-email.png" width="200" height="58" alt="Soccer Vision" style="display:block;border:0;height:auto;" />
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:800;color:#dde9ff;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.45;color:#798ba9;">
                  Someone asked to reset the password for your Soccer Vision account. Choose a new one here:
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .RedirectTo }}?token={{ .TokenHash }}" style="display:inline-block;padding:12px 22px;border:1px solid #39445b;border-radius:8px;background:#2a3142;color:#dde9ff;font-size:15px;font-weight:600;text-decoration:none;">
                    Choose a new password
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.45;color:#798ba9;">
                  The link works for 15 minutes. If you didn't ask for this, ignore this email: your password stays the same.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px;border-top:1px solid #2a3142;font-size:12px;line-height:1.45;color:#798ba9;">
                Soccer Vision by Devspirit ·
                <a href="https://soccer.dev-spirit.com" style="color:#626ed4;text-decoration:none;">soccer.dev-spirit.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
