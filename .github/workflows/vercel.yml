# Deploys the demo page to Vercel (project soccer-vision): every pull request gets a preview deployment, with its link
# posted on the PR, and every push to main is the production deployment at https://soccer.dev-spirit.com.
# The site is built here (tools/vercel-build.sh) and uploaded prebuilt, from a folder without .git, so Vercel's Hobby
# plan accepts it whoever authored the commit.
# Needs the repository secret VERCEL_TOKEN (vercel.com/account/tokens) and the variables VERCEL_ORG_ID / VERCEL_PROJECT_ID.
name: Vercel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    # PRs from forks get no secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then env=preview; prod=; else env=production; prod=--prod; fi
          echo "PROD=$prod" >> "$GITHUB_ENV"
          vercel pull --yes --environment=$env --token="$VERCEL_TOKEN"
          vercel build $prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          mkdir -p /tmp/site && cp -r .vercel /tmp/site/
          cd /tmp/site
          url=$(vercel deploy --prebuilt $PROD --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Vercel preview** for \`${sha}\`: ${process.env.URL}\n\nProduction (main): https://soccer.dev-spirit.com`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
