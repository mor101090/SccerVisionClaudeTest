# The full end-to-end suite, once a day at the end of the working day (not on every PR: it takes ~10 minutes).
# Runs main's code in CI (yarn dev) against the Supabase dev project; also startable by hand (Run workflow).
# A failure shows on the Actions tab and GitHub mails it to whoever last changed this schedule.
#
# Secrets: SUPABASE_DEV_DATABASE_URL (pooler :6543), SUPABASE_DEV_DATABASE_URL_UNPOOLED (direct :5432),
#          SUPABASE_DEV_SECRET_KEY.
# Variables: SUPABASE_DEV_URL, SUPABASE_DEV_PUBLISHABLE_KEY.
name: E2E (daily)

on:
  schedule:
    - cron: "0 18 * * 1-5" # 18:00 UTC = 20:00 Israel (winter), Monday-Friday
  workflow_dispatch:

concurrency:
  group: e2e-daily
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Enable corepack (Yarn 4 from packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - run: yarn install --immutable
      - name: Build engine (WASM) and classic page
        run: yarn assets:build
      - name: Env of the Supabase dev project, migrated, e2e accounts seeded
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DEV_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.SUPABASE_DEV_DATABASE_URL_UNPOOLED }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_DEV_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_DEV_PUBLISHABLE_KEY }}
        run: |
          {
            echo "DATABASE_URL=\"$DATABASE_URL\""
            echo "SUPABASE_SECRET_KEY=\"$SUPABASE_SECRET_KEY\""
            echo "NEXT_PUBLIC_SUPABASE_URL=\"$NEXT_PUBLIC_SUPABASE_URL\""
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\"$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY\""
          } > .env.local
          yarn db:migrate
          yarn e2e:seed
      - run: yarn playwright install --with-deps chromium
      - name: Playwright
        env:
          CI: "true"
        run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7
